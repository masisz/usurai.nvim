name: Security & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  secret-and-vuln-scan:
    name: Vulnerability & Secret Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability and secret scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret,misconfig"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  lua-syntax-check:
    name: Lua Syntax Verification (luac)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 (LuaJIT compatible syntax check)
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Check all Lua files for syntax errors
        run: |
          find init.lua lua -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
